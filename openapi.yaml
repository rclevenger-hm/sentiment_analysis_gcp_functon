  /jobs:
    post:
      operationId: submitJob
      summary: Submit an idempotent CSV or JSON job
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9._:-]{8,128}$
        - name: targeted
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: CSV only; JSON uses the body field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkRequest"
          text/csv:
            schema:
              type: string
            example: |
              id,text,source
              review-1,Great product,reviews
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "202":
          description: Accepted or existing unfinished job
