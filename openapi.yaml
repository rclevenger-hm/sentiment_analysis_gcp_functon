      operationId: analyzeSentiment
      summary: Analyze one text without retained history
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SingleRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sentiment"
        "400":
          description: Request rejected or service unavailable; gateway errors can use a
            gateway-managed body.
