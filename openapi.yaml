openapi: 3.0.3
info:
  title: Google Cloud Sentiment Analysis Service
  version: 1.0.0
  description: Authenticated Google Cloud functions for native polarity/magnitude
    analysis, derived labels, entity evidence, bulk jobs, reports and alerts.
servers:
  - url: https://{region}-{project}.cloudfunctions.net/{functionName}
    variables:
      region:
        default: us-central1
      project:
        default: YOUR_PROJECT
      functionName:
        default: sentiment-dev-api
security:
  - bearerAuth: []
paths:
