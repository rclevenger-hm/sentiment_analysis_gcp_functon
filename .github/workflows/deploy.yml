name: Deploy GCP
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, stage, prod]
        required: true
        default: dev
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_firestore_location: ${{ vars.FIRESTORE_LOCATION }}
      TF_VAR_name: ${{ vars.SERVICE_NAME || 'sentiment' }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_consumer_service_accounts: ${{ vars.CONSUMER_SERVICE_ACCOUNTS }}
      TF_VAR_notification_email: ${{ vars.NOTIFICATION_EMAIL }}
      TF_VAR_billing_account: ${{ vars.BILLING_ACCOUNT_ID }}
      TF_VAR_monthly_budget: ${{ vars.MONTHLY_BUDGET || '100' }}
      TF_VAR_budget_currency: ${{ vars.BUDGET_CURRENCY || 'USD' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run lint && npm test && npm run build
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Initialize remote state
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: >-
          terraform -chdir=terraform init -input=false -lockfile=readonly
          -backend-config="bucket=$STATE_BUCKET"
          -backend-config="prefix=sentiment/$DEPLOY_ENV"
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform plan -input=false -out=deploy.tfplan
      - run: terraform -chdir=terraform apply -input=false deploy.tfplan
      - name: Check anonymous access is denied
        run: |
          endpoint=$(terraform -chdir=terraform output -raw endpoint)
          status=$(curl --retry 5 --retry-all-errors --retry-delay 5 -s -o /dev/null -w '%{http_code}' "$endpoint/usage")
          case "$status" in 401|403) ;; *) exit 1 ;; esac
